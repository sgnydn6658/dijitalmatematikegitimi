<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GEOMBALA</title>
    <style>
        :root {
            --bg-shape2: #d8a027; /* Şekil 2 Orijinal Sarı/Hardal Rengi */
            --bg-shape3: #f5b083; /* Şekil 3 Orijinal Turuncu Rengi */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
        }

        .instructions {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 8px 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            border-radius: 4px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 900px;
        }

        .section-header {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        /* ŞEKİL 1: KESİK ÇİZGİLİ HAVUZ */
        .grid-shape1 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border: 2px solid #000;
            background: #fff;
        }

        .tile-s1 {
            border: 1px dashed #444;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: grab;
            background: #fff;
            transition: background 0.2s, transform 0.1s;
        }

        .tile-s1.selected {
            background-color: #d6eaf8;
            border: 2px solid #3498db;
        }

        .tile-s1.placed {
            opacity: 0.15;
            cursor: default;
            pointer-events: none;
        }

        /* ŞEKİL 2 VE 3 KARTLARI */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            border: 2px solid #888;
            background: #fff;
        }

        .cell {
            border: 1px solid #bdc3c7;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.05rem;
            font-weight: bold;
            position: relative;
            background: #fff;
        }

        /* Orijinal Görseldeki Dolu Renkli Hücreler */
        .cell.blocked-s2 { background-color: var(--bg-shape2); }
        .cell.blocked-s3 { background-color: var(--bg-shape3); }

        /* Doğru Yerleşim Efekti */
        .cell.correct {
            background-color: #2ecc71 !important;
            color: white;
            font-size: 0.75rem;
            padding: 2px;
            animation: shrinkIn 0.3s ease-out;
        }

        /* Yanlış Yerleşim Efekti */
        .cell.wrong-flash {
            background-color: #e74c3c !important;
            animation: shake 0.3s ease-in-out;
        }

        /* Animasyonlar */
        @keyframes shrinkIn {
            from { transform: scale(1.3); }
            to { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            background: #3498db;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>GEOMBALA</h1>

    <div class="instructions">
        👉 <b>Nasıl Oynanır?</b> Şekil-1'deki ifadeleri tutup Şekil-2 veya Şekil-3'teki doğru sembolün üzerine sürükleyin (ya da ifadeye dokunup ardından hedefe dokunun). Doğru ise yeşil renkle karta oturur, yanlış ise kırmızı uyarı verip yerleşmez.
    </div>

    <div class="game-container">
        
        <!-- ŞEKİL 1 -->
        <div>
            <div class="section-header">Şekil-1</div>
            <div class="grid-shape1" id="pool"></div>
        </div>

        <!-- ŞEKİL 2 -->
        <div>
            <div class="section-header">Şekil-2</div>
            <div class="bingo-grid" id="grid-s2"></div>
        </div>

        <!-- ŞEKİL 3 -->
        <div>
            <div class="section-header">Şekil-3</div>
            <div class="bingo-grid" id="grid-s3"></div>
        </div>

    </div>

    <script>
        // --- SES EFEKTLERİ (Web Audio API - Harici dosya gerektirmez) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.exponentialRampToValueAtTime(783, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // --- BİREBİR VERİLER ---

        // Şekil 1 Kart Havuzu
        const shape1Data = [
            "AB doğru parçası", "B noktası", "CD doğrusu", "KLM açısı", "MN ışını",
            "AB doğru parçasının uzunluğu", "KL doğrusu", "C noktası", "CD ışını", "MN doğru parçası",
            "ABC açısı", "AB doğrusu", "CD doğru parçası", "YZ doğru parçasının uzunluğu", "Z noktası",
            "AB ışını", "YZ doğrusu", "KL doğru parçası", "MN doğrusu", "KL ışını"
        ];

        // Şekil 2 Grid Düzeni (3x6)
        const shape2Grid = [
            [null, null, { s: "[AB]", m: "AB doğru parçası" }, { s: "MN", m: "MN doğrusu" }, null, { s: "|AB|", m: "AB doğru parçasının uzunluğu" }],
            [null, { s: "[CD]", m: "CD doğru parçası" }, null, { s: "[MN", m: "MN ışını" }, { s: "CD", m: "CD doğrusu" }, { s: "Z", m: "Z noktası" }],
            [{ s: "KL", m: "KL doğrusu" }, { s: "C", m: "C noktası" }, null, null, { s: "ABĈ", m: "ABC açısı" }, null]
        ];

        // Şekil 3 Grid Düzeni (3x6)
        const shape3Grid = [
            [{ s: "[AB", m: "AB ışını" }, { s: "YZ", m: "YZ doğrusu" }, null, { s: "[KL]", m: "KL doğru parçası" }, null, { s: "B", m: "B noktası" }],
            [null, null, { s: "KLM̂", m: "KLM açısı" }, null, { s: "[MN]", m: "MN doğru parçası" }, null],
            [null, { s: "[CD", m: "CD ışını" }, null, { s: "[KL", m: "KL ışını" }, { s: "|YZ|", m: "YZ doğru parçasının uzunluğu" }, { s: "AB", m: "AB doğrusu" }]
        ];

        let selectedTile = null;
        let dragClone = null;

        // OYUNU BAŞLAT
        function initGame() {
            renderPool();
            renderGrid("grid-s2", shape2Grid, "blocked-s2");
            renderGrid("grid-s3", shape3Grid, "blocked-s3");
        }

        function renderPool() {
            const poolEl = document.getElementById('pool');
            poolEl.innerHTML = '';
            shape1Data.forEach(text => {
                const tile = document.createElement('div');
                tile.className = 'tile-s1';
                tile.innerText = text;
                tile.dataset.text = text;
                tile.addEventListener('pointerdown', handlePointerDown);
                poolEl.appendChild(tile);
            });
        }

        function renderGrid(elementId, gridData, blockClass) {
            const gridEl = document.getElementById(elementId);
            gridEl.innerHTML = '';
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 6; c++) {
                    const item = gridData[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    if (item === null) {
                        cell.classList.add(blockClass);
                    } else {
                        if (item.s === "KLM̂") {
                            cell.innerHTML = '<span style="border-top:1.5px solid #000; padding-top:1px;">KLM</span>';
                        } else if (item.s === "ABĈ") {
                            cell.innerHTML = '<span style="border-top:1.5px solid #000; padding-top:1px;">ABC</span>';
                        } else {
                            cell.innerText = item.s;
                        }
                        cell.dataset.match = item.m;
                        cell.addEventListener('pointerup', handleCellPointerUp);
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        // --- ETKİLEŞİM YÖNETİMİ ---
        function handlePointerDown(e) {
            const tile = e.currentTarget;
            if (tile.classList.contains('placed')) return;

            if (selectedTile) selectedTile.classList.remove('selected');
            selectedTile = tile;
            selectedTile.classList.add('selected');

            createDragClone(e.clientX, e.clientY, tile.dataset.text);

            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
        }

        function handlePointerMove(e) {
            if (dragClone) {
                dragClone.style.left = e.clientX + 'px';
                dragClone.style.top = e.clientY + 'px';
            }
        }

        function handlePointerUp(e) {
            window.removeEventListener('pointermove', handlePointerMove);
            window.removeEventListener('pointerup', handlePointerUp);

            if (dragClone) {
                dragClone.hidden = true;
                const elem = document.elementFromPoint(e.clientX, e.clientY);
                dragClone.hidden = false;

                if (elem) {
                    const cell = elem.closest('.cell');
                    if (cell && !cell.classList.contains('correct')) {
                        checkMatch(selectedTile, cell);
                    }
                }
                removeDragClone();
            }
        }

        function handleCellPointerUp(e) {
            if (!selectedTile) return;
            const cell = e.currentTarget;
            if (cell.classList.contains('correct')) return;

            checkMatch(selectedTile, cell);
            removeDragClone();
        }

        function checkMatch(tile, cell) {
            const expected = cell.dataset.match;
            const actual = tile.dataset.text;

            if (expected === actual) {
                playSound('correct');
                cell.classList.add('correct');
                cell.innerText = actual; // Metin kutuya sığacak boyuta küçülür
                tile.classList.remove('selected');
                tile.classList.add('placed');
                selectedTile = null;
            } else {
                playSound('wrong');
                cell.classList.add('wrong-flash');
                setTimeout(() => cell.classList.remove('wrong-flash'), 300);
            }
        }

        function createDragClone(x, y, text) {
            removeDragClone();
            dragClone = document.createElement('div');
            dragClone.className = 'drag-clone';
            dragClone.innerText = text;
            dragClone.style.left = x + 'px';
            dragClone.style.top = y + 'px';
            document.body.appendChild(dragClone);
        }

        function removeDragClone() {
            if (dragClone) {
                dragClone.remove();
                dragClone = null;
            }
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
