<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Geombala</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none; /* Dokunmatik kaydırmayı kilitler, sürüklemeyi pürüzsüzleştirir */
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .game-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
    }
    .box {
      width: 45%;
      min-height: 250px;
      background-color: #ffffff;
      border: 3px dashed #bdc3c7;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-content: flex-start;
      align-items: center;
      justify-content: center;
    }
    .box h2 {
      width: 100%;
      text-align: center;
      color: #7f8c8d;
      font-size: 1.1rem;
      margin: 0 0 10px 0;
    }
    .draggable {
      width: 70px;
      height: 70px;
      background-color: #3498db;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: grab;
      position: relative;
      z-index: 10;
    }
    .target-box {
      border-color: #2ecc71;
      background-color: #e8f8f5;
    }
  </style>
</head>
<body>

  <h1>GEOMBALA</h1>
  <p>Şekilleri/Parçaları dokunarak hedef alana sürükleyin:</p>

  <div class="game-container">
    <!-- Kaynak Alanı -->
    <div class="box" id="source-box">
      <h2>Parçalar</h2>
      <div class="draggable" style="background-color: #e74c3c;">Üçgen</div>
      <div class="draggable" style="background-color: #9b59b6;">Kare</div>
      <div class="draggable" style="background-color: #f1c40f;">Daire</div>
    </div>

    <!-- Hedef Alanı -->
    <div class="box target-box" id="target-box">
      <h2>Hedef Alan</h2>
    </div>
  </div>

  <script>
    const draggables = document.querySelectorAll('.draggable');
    const targetBox = document.getElementById('target-box');
    const sourceBox = document.getElementById('source-box');

    draggables.forEach(item => {
      let active = false;
      let currentX, currentY, initialX, initialY;
      let xOffset = 0, yOffset = 0;

      // Dokunmatik Başlangıç
      item.addEventListener('touchstart', dragStart, { passive: false });
      item.addEventListener('touchend', dragEnd, { passive: false });
      item.addEventListener('touchmove', drag, { passive: false });

      // Fare Desteği (Masaüstü için)
      item.addEventListener('mousedown', dragStart);
      item.addEventListener('mouseup', dragEnd);
      item.addEventListener('mousemove', drag);

      function dragStart(e) {
        if (e.type === "touchstart") {
          initialX = e.touches[0].clientX - xOffset;
          initialY = e.touches[0].clientY - yOffset;
        } else {
          initialX = e.clientX - xOffset;
          initialY = e.clientY - yOffset;
        }
        active = true;
        item.style.zIndex = 1000;
      }

      function drag(e) {
        if (active) {
          e.preventDefault();
          if (e.type === "touchmove") {
            currentX = e.touches[0].clientX - initialX;
            currentY = e.touches[0].clientY - initialY;
          } else {
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
          }

          xOffset = currentX;
          yOffset = currentY;
          setTranslate(currentX, currentY, item);
        }
      }

      function dragEnd(e) {
        if (!active) return;
        active = false;
        item.style.zIndex = 10;

        // Bırakılan yerin konum kontrolü (Target Box içinde mi?)
        const rect = targetBox.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();

        const isInside = (
          itemRect.left >= rect.left &&
          itemRect.right <= rect.right &&
          itemRect.top >= rect.top &&
          itemRect.bottom <= rect.bottom
        );

        if (isInside) {
          targetBox.appendChild(item);
        } else {
          sourceBox.appendChild(item);
        }

        // Pozisyonu sıfırla (Kutu içine düzgün oturması için)
        xOffset = 0;
        yOffset = 0;
        setTranslate(0, 0, item);
      }

      function setTranslate(xPos, yPos, el) {
        el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
      }
    });
  </script>
</body>
</html>
