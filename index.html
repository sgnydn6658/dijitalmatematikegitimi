<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Matematik Sembolleri Tombala Oyunu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    h2 { margin-bottom: 5px; font-size: 16px; color: #333; text-align: center; }
    
    .section-title {
      font-weight: bold;
      font-size: 14px;
      margin: 10px 0 5px 0;
      width: 100%;
      max-width: 700px;
    }

    /* Izgara yapıları */
    .grid {
      display: grid;
      gap: 2px;
      background-color: #999;
      border: 2px solid #333;
      margin-bottom: 15px;
      width: 100%;
      max-width: 700px;
    }

    /* Şekil 1: 5 sütun, 4 satır */
    .grid-s1 { grid-template-columns: repeat(5, 1fr); }
    /* Şekil 2 ve 3: 6 sütun, 3 satır */
    .grid-s23 { grid-template-columns: repeat(6, 1fr); }

    .cell {
      background-color: #fff;
      aspect-ratio: 2.2 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      padding: 2px;
      position: relative;
    }

    /* Şekil 2 Renkli (Koyu Sarı/Turuncu) */
    .cell.s2-filled { background-color: #d4a32b; }
    /* Şekil 3 Renkli (Açık Turuncu) */
    .cell.s3-filled { background-color: #f8c48c; }

    /* Taşınabilir kartlar */
    .card {
      background-color: #ffffff;
      border: 1px dashed #444;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      font-size: 11px;
      line-height: 1.1;
    }

    /* Durum Efektleri */
    .correct { background-color: #4CAF50 !important; color: white; }
    .wrong { background-color: #f44336 !important; color: white; }
    
    /* Mobil Seçim Efekti */
    .selected { outline: 3px solid #2196F3; }

    @media (max-width: 600px) {
      .cell { font-size: 9px; }
      .card { font-size: 9px; }
    }
  </style>
</head>
<body>

  <h2>Geometrik Semboller Tombala Oyunu</h2>

  <div class="section-title">Şekil-1 (Kartlar)</div>
  <div id="sekil1" class="grid grid-s1"></div>

  <div class="section-title">Şekil-2</div>
  <div id="sekil2" class="grid grid-s23"></div>

  <div class="section-title">Şekil-3</div>
  <div id="sekil3" class="grid grid-s23"></div>

  <script>
    // Şekil-1 Verileri (Soru Metni ve Doğru Eşleşecek Sembol Kodu)
    const cardsData = [
      { id: "c1", text: "AB doğru parçası", target: "[AB]" },
      { id: "c2", text: "B noktası", target: "B" },
      { id: "c3", text: "CD doğrusu", target: "CD" },
      { id: "c4", text: "KLM açısı", target: "KLM_arc" },
      { id: "c5", text: "MN ışını", target: "[MN" },
      { id: "c6", text: "AB doğru parçasının uzunluğu", target: "|AB|" },
      { id: "c7", text: "KL doğrusu", target: "KL" },
      { id: "c8", text: "C noktası", target: "C" },
      { id: "c9", text: "CD ışını", target: "[CD" },
      { id: "c10", text: "MN doğru parçası", target: "[MN]" },
      { id: "c11", text: "ABC açısı", target: "ABC_arc" },
      { id: "c12", text: "AB doğrusu", target: "AB" },
      { id: "c13", text: "CD doğru parçası", target: "[CD]" },
      { id: "c14", text: "YZ doğru parçasının uzunluğu", target: "|YZ|" },
      { id: "c15", text: "Z noktası", target: "Z" },
      { id: "c16", text: "AB ışını", target: "[AB" },
      { id: "c17", text: "YZ doğrusu", target: "YZ" },
      { id: "c18", text: "KL doğru parçası", target: "[KL]" },
      { id: "c19", text: "MN doğrusu", target: "MN" },
      { id: "c20", text: "KL ışını", target: "[KL" }
    ];

    // Şekil-2 Verileri (null olanlar renkli/dolu kutulardır)
    const sekil2Data = [
      null, null, "[AB]", "MN", null, "|AB|",
      null, "[CD]", null, "[MN", "CD", "Z",
      "KL", "C", null, null, "ABC_arc", null
    ];

    // Şekil-3 Verileri (null olanlar renkli/dolu kutulardır)
    const sekil3Data = [
      "[AB", "YZ", null, "[KL]", null, "B",
      null, null, "KLM_arc", null, "[MN]", null,
      null, "[CD", null, "[KL", "|YZ|", "AB"
    ];

    // Sembol Metinleri / Görselleştirmeleri
    function formatSymbol(code) {
      if (!code) return "";
      if (code === "KLM_arc") return "K<span style='text-decoration:overline'>L</span>M";
      if (code === "ABC_arc") return "A<span style='text-decoration:overline'>B</span>C";
      return code;
    }

    // Ses Efektleri (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    let selectedCard = null;

    // Arayüzü Oluştur
    function init() {
      const s1Container = document.getElementById('sekil1');
      cardsData.forEach(card => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.draggable = true;
        cardEl.innerText = card.text;
        cardEl.dataset.id = card.id;
        cardEl.dataset.target = card.target;

        // Drag & Drop
        cardEl.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', card.id);
        });

        // Touch (Mobil) Seçim Support
        cardEl.addEventListener('click', () => {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          if (selectedCard) selectedCard.classList.remove('selected');
          selectedCard = cardEl;
          cardEl.classList.add('selected');
        });

        cell.appendChild(cardEl);
        s1Container.appendChild(cell);
      });

      // Şekil 2 Oluştur
      buildBoard('sekil2', sekil2Data, 's2-filled');
      // Şekil 3 Oluştur
      buildBoard('sekil3', sekil3Data, 's3-filled');
    }

    function buildBoard(containerId, data, filledClass) {
      const container = document.getElementById(containerId);
      data.forEach(item => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (item === null) {
          cell.classList.add(filledClass);
        } else {
          cell.innerHTML = formatSymbol(item);
          cell.dataset.symbol = item;

          // Drag Events
          cell.addEventListener('dragover', (e) => e.preventDefault());
          cell.addEventListener('drop', (e) => {
            e.preventDefault();
            const cardId = e.dataTransfer.getData('text/plain');
            const cardEl = document.querySelector(`[data-id="${cardId}"]`);
            checkMatch(cardEl, cell);
          });

          // Touch/Click Drop (Mobil)
          cell.addEventListener('click', () => {
            if (selectedCard) {
              checkMatch(selectedCard, cell);
              selectedCard.classList.remove('selected');
              selectedCard = null;
            }
          });
        }
        container.appendChild(cell);
      });
    }

    // Eşleşme Kontrolü
    function checkMatch(cardEl, targetCell) {
      if (!cardEl || targetCell.dataset.matched) return;

      const cardTarget = cardEl.dataset.target;
      const cellSymbol = targetCell.dataset.symbol;

      if (cardTarget === cellSymbol) {
        // DOĞRU
        playSound('correct');
        targetCell.classList.add('correct');
        targetCell.innerText = cardEl.innerText;
        targetCell.dataset.matched = "true";
        
        // Kartı kaynağında sil (yerini boş bırak)
        cardEl.remove();
      } else {
        // YANLIŞ
        playSound('wrong');
        targetCell.classList.add('wrong');
        setTimeout(() => {
          targetCell.classList.remove('wrong');
        }, 500);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
